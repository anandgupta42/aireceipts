name: Price scan

on:
  schedule:
    - cron: "43 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

# Serialize runs so two overlapping scans cannot both open a report.
concurrency:
  group: price-scan
  cancel-in-progress: false

jobs:
  tripwire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run advisory price tripwire
        id: tripwire
        shell: bash
        run: |
          set +e
          node scripts/price-tripwire.mjs \
            --report price-tripwire-report.md \
            --summary-json price-tripwire-summary.json \
            > price-tripwire-output.txt 2>&1
          status=$?
          set -e

          cat price-tripwire-output.txt

          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            exit "$status"
          fi

          cat price-tripwire-report.md >> "$GITHUB_STEP_SUMMARY"

          tripwire_status="$(node -e "const s = JSON.parse(require('node:fs').readFileSync('price-tripwire-summary.json', 'utf8')); console.log(s.status)")"
          drift_count="$(node -e "const s = JSON.parse(require('node:fs').readFileSync('price-tripwire-summary.json', 'utf8')); console.log(s.driftCount)")"
          discovery_count="$(node -e "const s = JSON.parse(require('node:fs').readFileSync('price-tripwire-summary.json', 'utf8')); console.log(s.discoveryCount)")"

          {
            echo "exit_code=$status"
            echo "status=$tripwire_status"
            echo "drift_count=$drift_count"
            echo "discovery_count=$discovery_count"
          } >> "$GITHUB_OUTPUT"

      # One rolling issue, not one per day. `drift`/`discovery`: refresh the open report
      # (or open it). `clean`: close it. `warn` (dataset fetch failed): touch nothing,
      # because zero counts on a failed fetch prove nothing.
      - name: Upsert drift/discovery issue
        if: steps.tripwire.outputs.status != 'warn'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TRIPWIRE_STATUS: ${{ steps.tripwire.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="prices: drift/discovery report"
          # Exact title match on the full open list (ascending, so the oldest report is
          # canonical); GitHub search mangles ':' and '/' in titles.
          matches="$(gh issue list --state open --limit 1000 --json number,title \
            --jq "map(select(.title == \"$title\") | .number) | sort | .[]")"
          canonical="$(printf '%s\n' "$matches" | head -n 1)"
          duplicates="$(printf '%s\n' "$matches" | tail -n +2)"

          # Fold any duplicates (from older runs) into the canonical issue.
          for dup in $duplicates; do
            gh issue close "$dup" --reason "not planned" \
              --comment "Duplicate of #$canonical, which is the rolling price tripwire report."
          done

          if [ "$TRIPWIRE_STATUS" = "clean" ]; then
            if [ -n "$canonical" ]; then
              gh issue close "$canonical" --comment "Tripwire is clean as of this run: $RUN_URL"
            fi
            exit 0
          fi

          {
            cat price-tripwire-report.md
            echo
            echo "_Last refreshed by [this run]($RUN_URL). This issue is updated in place daily while drift or discovery persists._"
          } > price-tripwire-issue.md

          if [ -n "$canonical" ]; then
            gh issue edit "$canonical" --body-file price-tripwire-issue.md
          else
            gh issue create \
              --title "$title" \
              --label "enhancement" \
              --body-file price-tripwire-issue.md
          fi
