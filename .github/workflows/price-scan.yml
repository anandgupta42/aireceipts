name: Price scan

on:
  schedule:
    - cron: "43 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  tripwire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run advisory price tripwire
        id: tripwire
        shell: bash
        run: |
          set +e
          node scripts/price-tripwire.mjs \
            --report price-tripwire-report.md \
            --summary-json price-tripwire-summary.json \
            > price-tripwire-output.txt 2>&1
          status=$?
          set -e

          cat price-tripwire-output.txt

          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            exit "$status"
          fi

          cat price-tripwire-report.md >> "$GITHUB_STEP_SUMMARY"

          drift_count="$(node -e "const s = JSON.parse(require('node:fs').readFileSync('price-tripwire-summary.json', 'utf8')); console.log(s.driftCount)")"
          discovery_count="$(node -e "const s = JSON.parse(require('node:fs').readFileSync('price-tripwire-summary.json', 'utf8')); console.log(s.discoveryCount)")"

          {
            echo "exit_code=$status"
            echo "drift_count=$drift_count"
            echo "discovery_count=$discovery_count"
          } >> "$GITHUB_OUTPUT"

          if [ "$drift_count" -gt 0 ] || [ "$discovery_count" -gt 0 ]; then
            echo "should_open=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_open=false" >> "$GITHUB_OUTPUT"
          fi

      # One rolling issue, not one per day: refresh the body of the open report if
      # it exists, otherwise open it. A clean run closes the open report.
      - name: Upsert drift/discovery issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHOULD_OPEN: ${{ steps.tripwire.outputs.should_open }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="prices: drift/discovery report"
          # Exact title match on the open list; GitHub search mangles ':' and '/' in titles.
          existing="$(gh issue list --state open --limit 200 --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")"

          if [ "$SHOULD_OPEN" != "true" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "Tripwire is clean as of this run: $RUN_URL"
            fi
            exit 0
          fi

          {
            cat price-tripwire-report.md
            echo
            echo "_Last refreshed by [this run]($RUN_URL). This issue is updated in place daily while drift or discovery persists._"
          } > price-tripwire-issue.md

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file price-tripwire-issue.md
          else
            gh issue create \
              --title "$title" \
              --label "enhancement" \
              --body-file price-tripwire-issue.md
          fi
